<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Orders — Hedakari Clothing CRM</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <h1>All orders</h1>
  <p class="subtitle">Every order from visits and WhatsApp together — mark each one complete once the factory has sent it out.</p>

  <div class="print-header">
    <h1 style="margin-bottom:2px;">Hedakari Clothing — Orders Report</h1>
    <p id="printGeneratedAt" style="margin:0;color:#444;"></p>
  </div>

  <div class="card" style="margin-bottom:24px;">
    <h2>Orders</h2>
    <div class="filter-bar order-filters">
      <select id="orderShopFilter"><option value="">All shops</option></select>
      <select id="orderSourceFilter"><option value="">All sources</option><option value="visit">Visit</option><option value="whatsapp">WhatsApp</option></select>
      <select id="orderStatusFilter"><option value="">All statuses</option><option value="pending">Pending</option><option value="processing">Processing</option><option value="completed">Completed</option></select>
      <div class="filter-date"><span class="filter-date-label">From</span><input id="orderStartDate" type="date" /></div>
      <div class="filter-date"><span class="filter-date-label">To</span><input id="orderEndDate" type="date" /></div>
      <button id="exportOrdersBtn" class="small-btn">Export CSV</button>
      <button id="printReportBtn" class="small-btn">Print / Save as PDF</button>
    </div>
    <div id="allOrdersTable"></div>
  </div>

  <div class="card" id="noOrderShopsCard">
    <h2>Shops with no orders yet</h2>
    <p class="subtitle" style="margin-bottom:14px;">Shops that have never placed an order, from either channel.</p>
    <div id="noOrderShops"></div>
  </div>
</main>

<script type="module">
import { Store, Dashboard, fmtMoney, showConnectionError, downloadCsv, orderStatusOf, statusControlHtml, deliveryPartHtml, orderTimestamp } from './assets/store.js';
import { renderNav } from './assets/nav.js';
import { enableImageLightbox } from './assets/lightbox.js';

try{
  await Store.initAuth();
  renderNav('orders-all.html');
  if (!Store.currentUser) {
    window.location.href = 'login.html';
    throw new Error('redirecting');
  }
  await Store.refresh(['reps', 'shops', 'designs', 'orders']);
}
catch(err){
  if (err.message !== 'redirecting') showConnectionError(err);
  throw err;
}

const orderShopFilter = document.getElementById('orderShopFilter');
const orderSourceFilter = document.getElementById('orderSourceFilter');
const orderStatusFilter = document.getElementById('orderStatusFilter');
const orderStartDate = document.getElementById('orderStartDate');
const orderEndDate = document.getElementById('orderEndDate');

orderShopFilter.innerHTML = '<option value="">All shops</option>' +
  Store.cache.shops.slice().sort((a,b) => a.name.localeCompare(b.name)).map(s => `<option value="${s.id}">${s.name}</option>`).join('');

function getFilteredOrders(){
  const shopId = orderShopFilter.value;
  const source = orderSourceFilter.value;
  const status = orderStatusFilter.value;
  const start = orderStartDate.value;
  const end = orderEndDate.value;

  return Store.cache.orders.filter(o => {
    const matchesShop = !shopId || o.shopId === shopId;
    const matchesSource = !source || o.source === source;
    const matchesStatus = !status || orderStatusOf(o) === status;
    const matchesStart = !start || (o.date || '').localeCompare(start) >= 0;
    const matchesEnd = !end || (o.date || '').localeCompare(end) <= 0;

    return matchesShop && matchesSource && matchesStatus && matchesStart && matchesEnd;
  }).sort((a,b) => orderTimestamp(b) - orderTimestamp(a));
}

function renderOrders(){
  const el = document.getElementById('allOrdersTable');
  const rows = getFilteredOrders();
  if(!rows.length){ el.innerHTML = '<div class="empty">No orders match the current filters.</div>'; return; }
  el.innerHTML = `
    <div class="table-scroll"><table><thead><tr><th>Date</th><th>Shop</th><th>Rep</th><th>Source</th><th>Delivery</th><th>Designs</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>
    ${rows.map(o => `<tr>
      <td>${o.date||'—'}</td>
      <td>${Store.shopName(o.shopId)}</td>
      <td>${Store.repName(o.repId)}</td>
      <td>${o.source==='visit'?'Visit':'WhatsApp'}</td>
      <td>${deliveryPartHtml(o)}</td>
      <td><div class="design-list">${(o.items||[]).map(it => `<span class="design-item">${Store.designThumbHtml(it.designId)}${Store.designCode(it.designId)} ×${it.qty}</span>`).join('') || '—'}</div></td>
      <td>${fmtMoney(o.total)}</td>
      <td>${statusControlHtml(o, Store.canChangeOrderStatus())}</td>
      <td class="table-actions">${Store.canDeleteRecords() ? `<button class="small-btn danger" data-action="delete-order" data-id="${o.id}">Delete</button>` : ''}</td>
    </tr>`).join('')}
    </tbody></table></div>
  `;
  el.querySelectorAll('select.status-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const id = sel.dataset.id;
      sel.disabled = true;
      try{
        await Store.setOrderStatus(id, sel.value);
        renderOrders();
      }catch(err){
        alert('Could not update status: ' + err.message);
        sel.disabled = false;
      }
    });
  });

  el.querySelectorAll('[data-action="delete-order"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this order?')) return;
      try { await Store.deleteOrder(btn.dataset.id); renderOrders(); } catch (err) { alert(err.message); }
    });
  });
}

[orderShopFilter, orderSourceFilter, orderStatusFilter, orderStartDate, orderEndDate].forEach(el => el.addEventListener('input', renderOrders));
[orderShopFilter, orderSourceFilter, orderStatusFilter].forEach(el => el.addEventListener('change', renderOrders));

document.getElementById('exportOrdersBtn').addEventListener('click', () => {
  const rows = getFilteredOrders().map(o => ({
    Date: o.date,
    Shop: Store.shopName(o.shopId),
    Rep: Store.repName(o.repId),
    Source: o.source === 'visit' ? 'Visit' : 'WhatsApp',
    Delivery: o.deliveryPart === 'now' ? 'Delivering now' : o.deliveryPart === 'remaining' ? 'To be made' : 'Full order',
    Status: orderStatusOf(o).charAt(0).toUpperCase() + orderStatusOf(o).slice(1),
    Total: o.total,
    Designs: (o.items || []).map(it => `${Store.designCode(it.designId)} x${it.qty}`).join(' | ')
  }));
  downloadCsv('crm-orders-report.csv', rows);
});

enableImageLightbox(document.getElementById('allOrdersTable'), '.zoomable-img');

document.getElementById('printReportBtn').addEventListener('click', () => {
  document.getElementById('printGeneratedAt').textContent = 'Generated ' + new Date().toLocaleString('en-US', { dateStyle: 'long', timeStyle: 'short' });
  window.print();
});

renderOrders();

function renderNoOrderShops(){
  const el = document.getElementById('noOrderShops');
  const shops = Dashboard.shopsWithoutOrders();
  if(!shops.length){ el.innerHTML = '<div class="empty">Every shop has placed at least one order.</div>'; return; }
  el.innerHTML = `
    <div class="table-scroll"><table><thead><tr><th>Shop</th><th>Contact</th><th>Phone</th><th>Area</th></tr></thead><tbody>
    ${shops.map(s => `<tr><td>${s.name}</td><td>${s.contactName||'—'}</td><td>${s.phone||'—'}</td><td>${s.area||'—'}</td></tr>`).join('')}
    </tbody></table></div>
  `;
}
renderNoOrderShops();
</script>
</body>
</html>
