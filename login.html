<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Login</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <div class="brand-lockup">
        <div class="brand-mark">H</div>
        <div>
          <h1>Hedakari CRM</h1>
          <p>Secure sales and order management</p>
        </div>
      </div>

      <form id="loginForm" class="entry-form auth-form">
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="admin@company.com" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" id="loginBtn">Sign in</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { Store, showConnectionError } from './assets/store.js';

    try {
      await Store.initAuth();
      if (Store.currentUser) {
        window.location.href = 'index.html';
      }
    } catch (err) {
      showConnectionError(err);
    }

    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const email = String(formData.get('email') || '').trim();
      const password = String(formData.get('password') || '');

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';

      try {
        await Store.login(email, password);
        window.location.href = 'index.html';
      } catch (err) {
        alert(err.message || 'Login failed.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
