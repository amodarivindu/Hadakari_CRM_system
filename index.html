<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Hedakari Clothing CRM</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <h1 id="greeting">Good morning 👋</h1>
  <p class="subtitle" id="todayLine"></p>

  <div class="grid stats" id="statTiles"></div>

  <div class="grid panels">
    <div class="card">
      <h2>Top-performing reps <span style="font-weight:400;color:var(--text-muted);font-size:12px;">last 7 days</span></h2>
      <div id="topRepsPanel"></div>
    </div>
    <div class="card">
      <h2>Top-performing designs <span style="font-weight:400;color:var(--text-muted);font-size:12px;">last 7 days, units ordered</span></h2>
      <div id="topDesignsPanel"></div>
    </div>
  </div>

  <div class="grid panels">
    <div class="card">
      <h2>Shops needing follow-up <span style="font-weight:400;color:var(--text-muted);font-size:12px;">no visit, order or WhatsApp send in 14+ days</span></h2>
      <div id="followUpPanel"></div>
    </div>
    <div class="card">
      <h2>Customers who haven't ordered in 30+ days</h2>
      <div id="stalePanel"></div>
    </div>
  </div>
</main>

<script type="module">
import { Store, Dashboard, fmtMoney, showConnectionError } from './assets/store.js';
import { renderNav } from './assets/nav.js';

try{
  await Store.initAuth();
  renderNav('index.html');
  if (!Store.currentUser) {
    window.location.href = 'login.html';
    throw new Error('redirecting');
  }
  await Store.refresh();
}
catch(err){
  if (err.message !== 'redirecting') showConnectionError(err);
  throw err;
}

const hour = new Date().getHours();
const greetingText = hour < 5 ? 'Working late'
  : hour < 12 ? 'Good morning'
  : hour < 17 ? 'Good afternoon'
  : hour < 21 ? 'Good evening'
  : 'Good night';
const greetingEmoji = hour < 5 ? '🌙' : hour < 12 ? '👋' : hour < 17 ? '☀️' : hour < 21 ? '🌇' : '🌙';
document.getElementById('greeting').textContent = `${greetingText} ${greetingEmoji}`;

document.getElementById('todayLine').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

function statTile(label, value, sub, subList){
  const div = document.createElement('div');
  div.className = 'card stat-tile';
  div.innerHTML = `
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
    ${subList && subList.length ? `<div class="sub-list">${subList.slice(0,4).map(s=>`<span>• ${s}</span>`).join('')}${subList.length>4?`<span>+ ${subList.length-4} more</span>`:''}</div>` : ''}
  `;
  return div;
}

const tiles = document.getElementById('statTiles');

const newDesigns = Dashboard.newDesignsThisWeek();
tiles.appendChild(statTile('New designs uploaded this week', newDesigns.count, null, newDesigns.list.map(d => d.name)));

const visitedYesterday = Dashboard.shopsVisitedYesterday();
tiles.appendChild(statTile('Shops visited yesterday', visitedYesterday.count, null, visitedYesterday.list));

const waSent = Dashboard.whatsappSentYesterday();
tiles.appendChild(statTile('WhatsApp catalogs sent yesterday', waSent.count, `to ${waSent.shopCount} shop${waSent.shopCount===1?'':'s'}`));

const visitOrders = Dashboard.ordersFromSourceYesterday('visit');
tiles.appendChild(statTile('Orders from visits yesterday', visitOrders.count, fmtMoney(visitOrders.total) + ' in value'));

const waOrders = Dashboard.ordersFromSourceYesterday('whatsapp');
tiles.appendChild(statTile('Orders from WhatsApp yesterday', waOrders.count, fmtMoney(waOrders.total) + ' in value'));

function rankList(container, items, valueFn, labelFn, formatFn){
  if(!items.length){ container.innerHTML = '<div class="empty">No data yet for this period.</div>'; return; }
  const max = Math.max(...items.map(valueFn));
  container.innerHTML = items.map((item, i) => `
    <div class="rank-row rank-item">
      <div class="rank">${i+1}</div>
      <div class="name">${labelFn(item)}</div>
      <div class="value">${formatFn(item)}</div>
      <div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${max ? (valueFn(item)/max*100) : 0}%"></div></div></div>
    </div>
  `).join('');
}

rankList(document.getElementById('topRepsPanel'), Dashboard.topReps(7), r => r.total, r => r.name, r => `${fmtMoney(r.total)} · ${r.orders} orders`);
rankList(document.getElementById('topDesignsPanel'), Dashboard.topDesigns(7), d => d.units, d => d.name, d => `${d.units} units`);

const followUp = Dashboard.shopsNeedingFollowUp();
const followUpEl = document.getElementById('followUpPanel');
followUpEl.innerHTML = followUp.length ? `
  <div class="table-scroll"><table><thead><tr><th>Shop</th><th>Area</th><th>Last activity</th></tr></thead><tbody>
  ${followUp.map(f => `<tr><td>${f.shop.name}</td><td>${f.shop.area||'—'}</td><td><span class="chip warning">${f.daysSince}d ago</span></td></tr>`).join('')}
  </tbody></table></div>
` : '<div class="empty">All shops have recent activity. Nice work.</div>';

const stale = Dashboard.customersStale();
const staleEl = document.getElementById('stalePanel');
staleEl.innerHTML = stale.length ? `
  <div class="table-scroll"><table><thead><tr><th>Shop</th><th>Area</th><th>Last order</th></tr></thead><tbody>
  ${stale.map(s => `<tr><td>${s.shop.name}</td><td>${s.shop.area||'—'}</td><td><span class="chip critical">${s.daysSince===null?'Never ordered':s.daysSince+'d ago'}</span></td></tr>`).join('')}
  </tbody></table></div>
` : '<div class="empty">Every customer has ordered within the last 30 days.</div>';
</script>
</body>
</html>
